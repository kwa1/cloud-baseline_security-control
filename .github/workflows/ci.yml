name: CI - SBOM & Vulnerability Gates

on:
  push:
    branches: ["main", "develop", "feature/*"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]

permissions: {}

jobs:
  security-check:
    # Local reusable workflow in this repository; environment is resolved inside it from the git ref.
    uses: ./.github/workflows/mitre-security-pipeline.yml
    permissions:
      contents: read
      security-events: write
      id-token: write
    with:
      image_name: myapp
      aws_role_arn: ${{ vars.AWS_SECURITY_GATES_ROLE_ARN }}
      s3_bucket: ${{ vars.SECURITY_REPORTS_S3_BUCKET }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
